name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [type-check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Check bundle sizes
        run: |
          set -e

          echo "📦 Checking bundle sizes..."

          # Function to check individual file size
          check_file() {
            local file=$1
            local max_size_kb=$2
            local description=$3

            if [ -f "$file" ]; then
              local size_kb=$(du -k "$file" | cut -f1)
              local size_kb_int=${size_kb%.*}  # Remove decimal if present
              echo "  $description: ${size_kb}KB (limit: ${max_size_kb}KB)"

              if [ "$size_kb_int" -gt "$max_size_kb" ]; then
                echo "❌ $description exceeds ${max_size_kb}KB limit (actual: ${size_kb}KB)"
                return 1
              fi
              echo "✅ $description is within limit"
            else
              echo "⚠️  File not found: $file"
            fi
            return 0
          }

          # Get the actual bundle file names (they have hash suffixes)
          MAIN_JS=$(ls dist/assets/index-*.js 2>/dev/null | head -1)
          MAIN_CSS=$(ls dist/assets/index-*.css 2>/dev/null | head -1)
          ICONS_VENDOR=$(ls dist/assets/icons-vendor-*.js 2>/dev/null | head -1)
          MOTION_VENDOR=$(ls dist/assets/motion-vendor-*.js 2>/dev/null | head -1)
          SUPABASE_VENDOR=$(ls dist/assets/supabase-vendor-*.js 2>/dev/null | head -1)
          REACT_VENDOR=$(ls dist/assets/react-vendor-*.js 2>/dev/null | head -1)
          GENAI_VENDOR=$(ls dist/assets/genai-vendor-*.js 2>/dev/null | head -1)

          # Check main application bundle
          check_file "$MAIN_JS" 350 "Main application bundle"

          # Check CSS bundle
          check_file "$MAIN_CSS" 10 "Main CSS bundle"

          # Check vendor chunks
          check_file "$ICONS_VENDOR" 40 "Icons vendor chunk"
          check_file "$MOTION_VENDOR" 150 "Motion vendor chunk"
          check_file "$SUPABASE_VENDOR" 200 "Supabase vendor chunk"
          check_file "$REACT_VENDOR" 220 "React vendor chunk"
          check_file "$GENAI_VENDOR" 280 "GenAI vendor chunk"

          echo ""
          echo "✅ All bundle sizes are within acceptable limits!"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint || echo "Lint not configured yet, skipping"
